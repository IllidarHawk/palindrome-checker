<DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Palindrome Checker</title>
        <link rel="stylesheet" href="./styles.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Winky+Sans">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Gidole">
        
      </head>
      <body>
        <h1 class="header">Is it a palindrome?</h1>
        <div class="outer-container explanation-text">
          <p>
            A 
            <dfn><mark>palindrome</mark></dfn>
            is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing
          </p>
        </div>
        <div class="outer-container checker">
          <fieldset>
            <legend>
              <label for="text-input">Enter text to check if it is a palindrome</label>
            </legend>
            <input id="text-input"/>
            <button id="check-btn">Check</button>
            <div>
              <p id="result" class="hidden"></p>
            </div>
          </fieldset>
        </div>
        <script src="./script.js" defer></script>
      </body>
    </html>
